html,body{height:100%;overflow:hidden;overscroll-behavior:none}

:root{--s:1px;--c:1px;--fl:0px;--ft:0px}

.stage{position:fixed;left:0;top:0;width:100%;height:100svh;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}
.frame{position:absolute;left:var(--fl);top:var(--ft);width:calc(1440 * var(--s));height:calc(900 * var(--s))}

@media (min-width:768px){
  .home .nav{--nav-pt:calc(28 * var(--c));--nav-px:calc(42 * var(--c));--nav-fs:max(12px, calc(17 * var(--c)))}
}

/* hero */
.hero{background:#FBF4E9;z-index:1}
.hero .frame{transform-origin:50% 50%;will-change:transform}
.hero .frame img,.hero .frame video{position:absolute;width:102.78%;left:-.14%;top:-5.22%}
.hero .frame video{aspect-ratio:1168/784;opacity:0;object-fit:cover}
#va{z-index:1}#vb{z-index:2}
.mark{position:absolute;left:0;right:0;top:0;text-align:center;white-space:nowrap;

.hero-cta{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;flex-direction:column;align-items:center;text-align:center;

.hero-cta::before{content:"";position:absolute;left:50%;top:50%;width:min(720px,110vw);height:180%;transform:translate(-50%,-50%);z-index:-1;

.hero-line{font-family:var(--serif);font-weight:400;font-size:var(--hh);letter-spacing:.2em;line-height:1.35;text-transform:uppercase;

.hero-cta .pill{margin-top:var(--hb);--pill-fs:var(--hf)}

/* ingredients */
.ingr{z-index:2;pointer-events:none}
.chip{position:absolute;left:0;top:0;transform:translate(-50%, calc(var(--chip) / -2))}
.in-w{display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:scale(.7);

.ingr.on .in-w{opacity:1;transform:none}
.chip .disc{width:var(--chip);height:var(--chip);border-radius:50%;padding:4%;background:var(--bg);

.chip .disc i,.thumb i{display:block;width:100%;height:100%;border-radius:50%;background-repeat:no-repeat}
.chip .disc i{background-size:cover;background-position:center}
.chip b{font-weight:500;font-size:var(--cn);margin-top:calc(var(--chip) * .2);white-space:nowrap}
.chip span{color:var(--ink2);font-size:var(--cs);line-height:1.3;max-width:calc(var(--chip) * 2.3)}

/* benefits */
.bene{background:var(--bg3);z-index:3;transform:translateY(100%);will-change:transform}
.rows{position:absolute;left:var(--rl);top:50%;transform:translateY(-44%)}
.row{display:flex;align-items:center;gap:calc(var(--rt) * .28);opacity:0;transform:translateX(60px);

.row+.row{margin-top:var(--rg)}
.bene.on .row{opacity:1;transform:none}
.bene.on .row:nth-child(2){transition-delay:.12s}
.bene.on .row:nth-child(3){transition-delay:.24s}

.row p{font-size:var(--rp);line-height:1.45;color:var(--ink2);margin-top:.25em;max-width:var(--rw)}
.portrait .rows{left:var(--rl);right:var(--rl);top:var(--rtop);transform:none}

/* final scene */
.scene{background:var(--dark);z-index:4;transform:translateY(100%);will-change:transform}
.scene .frame img{position:absolute;width:100%;left:0;top:-3.75%}
.cta{position:absolute;left:0;right:0;top:var(--ctop);display:flex;flex-direction:column;align-items:center;

form{display:flex;flex-direction:column;gap:22px}

<script>
(() => {
'use strict';
const HAND_URL = 'assets/hand-raw.webp';
const HAND_CROP = [0, 240, 858, 262];
const HAND_R = 262 / 858;
const BOT_R = 597 / 185;            // serum bottle cutout height / width
const PHOTO = 'assets/nuee-serum-photo.jpg', PHOTO_N = 736;

const $ = id => document.getElementById(id);
const root = document.documentElement;
const stage = $('stage'), nav = $('nav'), hero = $('hero'), heroFrame = $('heroFrame'), mark = $('mark'), heroCta = $('heroCta');
const ingr = $('ingr'), bene = $('bene'), rowsEl = $('rows'), scene = $('scene'), cta = $('cta'), info = $('info');
const jar = $('jar'), hand = $('hand'), handImg = $('handImg'), handFront = $('handFront'), handImg2 = $('handImg2');
const va = $('va'), vb = $('vb');
const chips = [...document.querySelectorAll('.chip')];
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const LAST = 4;   // 0 hero, 1 ingredients, 2 benefits, 3 pedestal, 4 about/reviews/contact panel

/* ---------- easing ---------- */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6) return sy(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
    let lo = 0, hi = 1; t = x;
    for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return sy(t);
  };
}
const EJ = bezier(.3, 0, .05, 1), EP = bezier(.3, 0, .15, 1), EF = bezier(.25, .1, .25, 1), EY = bezier(.5, 0, .1, 1);
const EI = bezier(.5, 0, 0, 1);

/* ---------- channels ---------- */
class Axis {
  constructor(v) { this.v = v; this.cur = null; this.next = null; }
  set(to, dur, ease, delay, now) {
    if (!dur && !delay) { this.v = to; this.cur = this.next = null; return; }
    this.next = { to, dur: dur || 0, ease, start: now + (delay || 0) };
    if (!delay) this.tick(now);
  }
  tick(now) {
    if (this.next && now >= this.next.start) {
      const n = this.next; this.next = null;
      this.cur = { from: this.v, to: n.to, t0: n.start, dur: n.dur, ease: n.ease };
    }
    if (this.cur) {
      const c = this.cur, p = c.dur ? Math.min(1, (now - c.t0) / c.dur) : 1;
      this.v = c.from + (c.to - c.from) * c.ease(p);
      if (p >= 1) { this.v = c.to; this.cur = null; }
    }
  }
}
class Channel {
  constructor(v) { this.arr = Array.isArray(v); this.ax = (this.arr ? v : [v]).map(x => new Axis(x)); }
  get v() { return this.arr ? this.ax.map(a => a.v) : this.ax[0].v; }
  to(target, spec, now = performance.now()) {
    const t = this.arr ? target : [target];
    t.forEach((x, i) => {
      const sp = Array.isArray(spec) ? spec[i] : spec;
      this.ax[i].set(x, instantMode ? 0 : sp.dur, sp.ease || EP, instantMode ? 0 : sp.delay || 0, now);
    });
  }
  snap(target) { (this.arr ? target : [target]).forEach((x, i) => this.ax[i].set(x, 0, EP, 0, 0)); }
  tick(now) { this.ax.forEach(a => a.tick(now)); }
}
let instantMode = false;

/* ---------- layout ---------- */
let vw, vh, s, c, fl, ft, ul, ut, portrait, navBottom;
let K0, K1, K2, K4, W = 300, hw = 900, hx0 = 0, handTop = 0;
const F = (x, y, h) => ({ x: fl + x * s, y: ft + y * s, h: h * s });
const U = (x, y, h) => ({ x: ul + x * c, y: ut + y * c, h: h * c });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const setVar = (el, k, v) => el.style.setProperty(k, v);

function layout() {
  vw = innerWidth; vh = stage.clientHeight;
  s = Math.max(vw / 1440, vh / 900); c = Math.min(vw / 1440, vh / 900);
  fl = (vw - 1440 * s) / 2; ft = (vh - 900 * s) / 2; ul = (vw - 1440 * c) / 2; ut = (vh - 900 * c) / 2;
  portrait = vw / vh < 0.9;
  root.classList.toggle('portrait', portrait);
  setVar(root, '--s', s + 'px'); setVar(root, '--c', c + 'px'); setVar(root, '--fl', fl + 'px'); setVar(root, '--ft', ft + 'px');
  navBottom = nav.getBoundingClientRect().bottom;

  // K0: standing on the flat top of the rock
  K0 = F(720, 490, 330);
  if (portrait) K0.h = Math.min(K0.h, 0.48 * vw * BOT_R);
  K0.h = Math.max(60, Math.min(K0.h, K0.y - navBottom - 10)); // never touch the nav

  /* chips */
  let chip, labelBottom = 0;
  if (!portrait) {
    chip = Math.max(44, 116 * c);
    setVar(ingr, '--chip', chip + 'px'); setVar(ingr, '--cn', Math.max(12, 21 * c) + 'px'); setVar(ingr, '--cs', Math.max(11, 17.5 * c) + 'px');
    const kx = Math.max(c, 0.96 * vw / 1440);
    const dy = Math.max(0, navBottom + 6 - (ut + 196 * c - chip / 2));
    const P = { ha: [230, 421], nia: [454, 268], vc: [720, 196], sq: [988, 278], ve: [1212, 439] };
    chips.forEach(el => { const p = P[el.dataset.k]; place(el, vw / 2 + (p[0] - 720) * kx, ut + p[1] * c + dy); });
    K1 = U(720, 1040, 640); K1.x = vw / 2; K1.y += dy;
  } else {
    chip = Math.min(Math.max(58, 0.17 * vw), 96);
    setVar(ingr, '--chip', chip + 'px');
    setVar(ingr, '--cn', Math.min(Math.max(12, 0.034 * vw), 17) + 'px'); setVar(ingr, '--cs', Math.min(Math.max(11, 0.029 * vw), 15) + 'px');
    const top = Math.max(64, 0.06 * vh, navBottom + 8) + chip / 2 + 8;
    const row2 = top + chip + Math.max(84, 0.10 * vh);
    const P = { nia: [0.20, top + 0.35 * chip], vc: [0.50, top], sq: [0.80, top + 0.35 * chip], ha: [0.25, row2], ve: [0.75, row2] };
    chips.forEach(el => { const p = P[el.dataset.k]; place(el, p[0] * vw, p[1] + 0.55 * chip); });
    chips.forEach(el => { labelBottom = Math.max(labelBottom, parseFloat(el.style.top) - chip / 2 + el.offsetHeight); });
    const h1 = 0.55 * vh;
    K1 = { x: vw / 2, h: h1, y: Math.max(vh + 0.16 * h1, labelBottom + 10 + h1) };
  }

  /* benefits */
  if (!portrait) {
    setVar(bene, '--rt', Math.max(48, 96 * c) + 'px'); setVar(bene, '--rh', Math.max(14, 25 * c) + 'px');
    setVar(bene, '--rp', Math.max(11, 16.5 * c) + 'px'); setVar(bene, '--rg', Math.max(14, 40 * c) + 'px');
    setVar(bene, '--rw', Math.max(200, 330 * c) + 'px'); setVar(bene, '--rl', (ul + 915 * c) + 'px');
    K2 = U(465, 640, 340);
    hw = K2.h * 2.8;
    hx0 = K2.x - 0.56 * hw;
    K2.x = hx0 + 0.63 * hw;
    if (hx0 > 0) { hw = K2.x / 0.63; hx0 = 0; } // forearm always runs off the left edge
  } else {
    setVar(bene, '--rt', Math.min(Math.max(48, 0.13 * vw), 76) + 'px'); setVar(bene, '--rh', Math.min(Math.max(15, 0.042 * vw), 22) + 'px');
    setVar(bene, '--rp', Math.min(Math.max(12, 0.033 * vw), 16) + 'px'); setVar(bene, '--rg', Math.min(Math.max(12, 0.022 * vh), 26) + 'px');
    setVar(bene, '--rw', 'none'); setVar(bene, '--rl', Math.max(18, 0.06 * vw) + 'px');
    setVar(bene, '--rtop', (Math.max(64, 0.07 * vh, navBottom + 4) + 10) + 'px');
    const rowsBottom = rowsEl.offsetTop + rowsEl.offsetHeight;
    const y = 0.80 * vh;
    const h = Math.max(90, Math.min(0.30 * vh, 0.8 * vw, y - rowsBottom - 16));
    K2 = { x: vw / 2, y, h };
    hw = Math.max(h * 2.8, 1.15 * vw);
    hx0 = vw / 2 - 0.63 * hw;
  }
  const hh = hw * HAND_R;
  const SEAT = 0.46;            // bottle base sits 46% down the hand image, in the middle of the palm
  handTop = K2.y - SEAT * hh;
  [hand, handFront].forEach(el => { el.style.width = hw + 'px'; el.style.height = hh + 'px'; });
  setVar(hand, '--py', SEAT * 100 + '%'); setVar(hand, '--pw', 1.3 * K2.h / BOT_R + 'px');
  $('palmShadow').style.left = ((K2.x - hx0) / hw * 100) + '%';
  // front copy of the hand: visible only in a band around the bottle base, with a curved opening so the
  // palm rises around the sides of the base (cupped) and the centre of the base stays just visible
  const bw = K2.h / BOT_R, bx = K2.x - hx0, by = SEAT * hh;
  setVar(handFront, '--mx', bx + 'px'); setVar(handFront, '--my', (by - 0.42 * bw) + 'px');
  setVar(handFront, '--mrx', 0.58 * bw + 'px'); setVar(handFront, '--mry', 0.45 * bw + 'px');
  setVar(handFront, '--ml', (bx - 0.9 * bw) + 'px'); setVar(handFront, '--mt', (by - 0.3 * bw) + 'px');
  setVar(handFront, '--mw', 1.8 * bw + 'px'); setVar(handFront, '--mh', (hh - by + 0.3 * bw) + 'px');

  /* final scene */
  K4 = F(720, 697, 240);
  const glow = $('glow'), gs = K4.h * 2.6;
  glow.style.left = K4.x + 'px'; glow.style.top = (K4.y - 0.55 * K4.h) + 'px'; setVar(glow, '--gs', gs + 'px');
  if (!portrait) {
    setVar(cta, '--th', Math.max(17, 34 * c) + 'px'); setVar(cta, '--tf', Math.max(12, 16 * c) + 'px');
    setVar(cta, '--tb', Math.max(16, 30 * c) + 'px'); setVar(cta, '--ctop', Math.max(ut + 150 * c, navBottom + 16) + 'px');
  } else {
    setVar(cta, '--th', Math.min(Math.max(16, 0.052 * vw), 34) + 'px'); setVar(cta, '--tf', '14px');
    setVar(cta, '--tb', '20px'); setVar(cta, '--ctop', Math.max(84, 0.13 * vh) + 'px');
  }

  /* hero headline + Shop button: same type as the Discover button, on the water below the rock */
  if (!portrait) { setVar(heroCta, '--hh', Math.max(13, 20 * c) + 'px'); setVar(heroCta, '--hf', Math.max(12, 16 * c) + 'px'); setVar(heroCta, '--hb', Math.max(14, 22 * c) + 'px'); }
  else { setVar(heroCta, '--hh', Math.min(Math.max(13, 0.036 * vw), 18) + 'px'); setVar(heroCta, '--hf', '14px'); setVar(heroCta, '--hb', '16px'); }
  const ctaH = heroCta.offsetHeight;
  let ctaTop = Math.max(ft + 640 * s, vh - ctaH - Math.max(28, 0.06 * vh));
  ctaTop = Math.min(ctaTop, vh - ctaH - 12);
  heroCta.style.top = ctaTop + 'px';

  /* product image base width = largest keyframe width */
  W = Math.max(K0.h, K1.h, K2.h, K4.h) / BOT_R;
  jar.style.width = W + 'px';

  layoutMark();
}
function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }

/* wordmark: sized by its rendered width, x-height centred on the bottle's upper quarter */
const mctx = document.createElement('canvas').getContext('2d');
function layoutMark() {
  const target = portrait ? 0.9 * vw : Math.min(820 * s, 0.86 * vw);
  mark.style.fontSize = '100px';
  const r = document.createRange(); r.selectNodeContents(mark);
  const w100 = r.getBoundingClientRect().width || 200;
  const fs = 100 * target / w100;
  mark.style.fontSize = fs + 'px';
  mctx.font = `400 ${fs}px "Playfair Display"`;
  const m = mctx.measureText('nuee');
  const fa = m.fontBoundingBoxAscent ?? fs * 1.082, fd = m.fontBoundingBoxDescent ?? fs * .251;
  const base = (fs - (fa + fd)) / 2 + fa;
  const xh = mctx.measureText('nuu').actualBoundingBoxAscent || fs * .514;
  const acc = mctx.measureText('é').actualBoundingBoxAscent || fs * .74;
  const bottleTop = K0.y - K0.h;
  let top = bottleTop + 0.25 * K0.h - (base - xh / 2);
  const minTop = navBottom + 12 - (base - acc);
  if (top < minTop) top = minTop;
  mark.style.top = top + 'px';
}

/* ---------- channels & states ---------- */
const ch = {
  jar: new Channel([0, 0, 0]), hero: new Channel(1), bene: new Channel(0), handOut: new Channel(0),
  rows: new Channel(0), scene: new Channel(0), info: new Channel(0), intro: new Channel(0)
};
const key = n => [K0, K1, K2, K4, K4][n];
const kv = k => [k.x, k.y, k.h];
let state = 0, timers = [];

function setOn(el, on, delay) {
  if (!on) { el.classList.remove('on'); return; }
  if (instantMode || !delay) { el.classList.add('on'); return; }
  timers.push(setTimeout(() => el.classList.add('on'), delay));
}
function go(n, instant) {
  n = clamp(n | 0, 0, LAST);
  const from = state; state = n; api.state = n;
  instantMode = !!instant || RM.matches;
  timers.forEach(clearTimeout); timers = [];
  const now = performance.now();
  const J = { dur: 1150, ease: EJ }, P7 = { dur: 700, ease: EP }, P65 = { dur: 650, ease: EP };
  [ingr, bene, scene].forEach(l => l.classList.remove('on'));
  jar.classList.remove('lit');
  ch.info.to(n === 4 ? 1 : 0, P65, now);

  if (n === 0) {
    ch.jar.to(kv(K0), J, now); ch.hero.to(1, P7, now); ch.bene.to(0, P65, now);
    ch.handOut.to(0, P65, now); ch.rows.to(0, { dur: 400, ease: EF }, now); ch.scene.to(0, P65, now);
  } else if (n === 1) {
    ch.jar.to(kv(K1), J, now); ch.hero.to(0, P7, now); ch.bene.to(0, P65, now);
    ch.handOut.to(0, P65, now); ch.rows.to(0, { dur: 400, ease: EF }, now); ch.scene.to(0, P65, now);
    setOn(ingr, true, from < 1 ? 1000 : 600);
  } else if (n === 2) {
    const back = from >= 3;
    ch.jar.to(kv(K2), J, now); ch.hero.to(0, P7, now); ch.bene.to(1, P65, now); ch.scene.to(0, P65, now);
    ch.handOut.to(0, { dur: 650, ease: EP, delay: back ? 150 : 0 }, now);
    ch.rows.to(1, { dur: 500, ease: EF, delay: back ? 300 : 0 }, now);
    setOn(bene, true, back ? 350 : 550);
  } else {
    const settled = from >= 3;
    if (from === 2) ch.jar.to(kv(K4), [{ dur: 700, ease: EJ }, { dur: 1600, ease: EY }, { dur: 1600, ease: EJ }], now);
    else ch.jar.to(kv(K4), J, now);
    ch.hero.to(0, P7, now);
    ch.handOut.to(1, { dur: 600, ease: EP }, now); ch.rows.to(0, { dur: 400, ease: EF }, now);
    ch.scene.to(1, { dur: 650, ease: EP, delay: settled ? 0 : 350 }, now);
    setOn(scene, true, settled ? 0 : 1350);
    if (instantMode || settled) jar.classList.add('lit'); else timers.push(setTimeout(() => jar.classList.add('lit'), 1350));
  }
  if (n === 4) { info.setAttribute('aria-hidden', 'false'); info.inert = false; try { info.focus({ preventScroll: true }); } catch (e) {} }
  else { info.setAttribute('aria-hidden', 'true'); info.inert = true; }
  instantMode = false;
}
function snapAll() {
  const n = state;
  ch.jar.snap(kv(key(n)));
  ch.hero.snap(n === 0 ? 1 : 0); ch.bene.snap(n >= 2 ? 1 : 0); ch.handOut.snap(n >= 3 ? 1 : 0);
  ch.rows.snap(n === 2 ? 1 : 0); ch.scene.snap(n >= 3 ? 1 : 0); ch.info.snap(n === 4 ? 1 : 0);
}

/* ---------- render loop ---------- */
function render(now) {
  for (const k in ch) ch[k].tick(now);
  const [x, y, h] = ch.jar.v, w = h / BOT_R, io = ch.intro.v;
  jar.style.transform = `translate3d(${x - W / 2}px,${y - W * BOT_R + io}px,0) scale(${w / W})`;
  const hv = ch.hero.v;
  hero.style.opacity = hv;
  heroFrame.style.transform = `translate3d(0,${io}px,0) scale(${1 + (1 - hv) * 0.06})`;
  const b = ch.bene.v;
  bene.style.transform = `translate3d(0,${(1 - b) * 100}%,0)`;
  hand.style.transform = handFront.style.transform = `translate3d(${hx0 - ch.handOut.v * (hx0 + 1.05 * hw)}px,${handTop + (1 - b) * vh}px,0)`;
  rowsEl.style.opacity = ch.rows.v;
  const sc = ch.scene.v, iv = ch.info.v;
  scene.style.transform = `translate3d(0,${(1 - sc) * 100}%,0)`;
  info.style.transform = `translate3d(0,${(1 - iv) * 100}%,0)`;
  info.style.visibility = iv < 0.001 ? 'hidden' : 'visible';
  nav.classList.toggle('light', sc > 0.96 && iv < 0.5);
  nav.classList.toggle('solid', iv > 0.5);
  videoTick(hv);
  requestAnimationFrame(render);
}

/* ---------- hero water loop (two-video crossfade) ---------- */
let vActive = va, vIdle = vb, fading = false, vPaused = false, vStarted = false;
[va, vb].forEach(v => { v.muted = true; v.style.transition = 'opacity .6s linear'; });
function startVideo() {
  if (RM.matches) return;
  va.currentTime = 0;
  va.addEventListener('playing', () => { va.style.transition = 'none'; va.style.opacity = 1; requestAnimationFrame(() => va.style.transition = 'opacity .6s linear'); }, { once: true });
  va.play().then(() => vStarted = true).catch(() => {});
}
function videoTick(hv) {
  if (!vStarted) return;
  const hidden = state !== 0 && hv < 0.01;
  if (hidden && !vPaused) { va.pause(); vb.pause(); vPaused = true; return; }
  if (!hidden && vPaused) { vPaused = false; vActive.play().catch(() => {}); }
  if (vPaused || fading) return;
  const d = vActive.duration;
  if (d && vActive.currentTime >= d - 0.6) {
    fading = true;
    const inc = vIdle, out = vActive;
    inc.style.zIndex = 2; out.style.zIndex = 1;
    inc.currentTime = 0;
    inc.play().catch(() => {});
    inc.style.opacity = 1;
    setTimeout(() => {
      out.pause(); out.style.transition = 'none'; out.style.opacity = 0;
      requestAnimationFrame(() => out.style.transition = 'opacity .6s linear');
      vActive = inc; vIdle = out; fading = false;
    }, 600);
  }
}

/* ---------- input: one gesture = one step ---------- */
let lockUntil = 0, wAcc = 0, wLast = 0, wPrev = 0, needFresh = false, infoTopSince = 0;
const menuOpen = () => root.classList.contains('menu-open');
function step(dir) {
  const now = performance.now();
  if (now < lockUntil) return;
  const n = clamp(state + dir, 0, LAST);
  if (n !== state) { go(n); lockUntil = now + 1000; }
}
info.addEventListener('scroll', () => { infoTopSince = info.scrollTop > 0 ? Infinity : performance.now(); }, { passive: true });
addEventListener('wheel', e => {
  if (menuOpen()) return;
  const now = performance.now();
  const d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vh : 1), a = Math.abs(d);
  const fresh = now - wLast > 160 || a > 1.6 * wPrev + 4;
  wLast = now; wPrev = a;
  if (state === 4) {
    // the panel scrolls natively; a fresh upward flick at its very top returns to the pedestal scene
    if (info.scrollTop > 0 || d >= 0) return;
    e.preventDefault();
    if (fresh && now - infoTopSince > 200) step(-1);
    return;
  }
  e.preventDefault();
  if (fresh) { wAcc = 0; needFresh = false; }
  if (now < lockUntil || needFresh) return;
  wAcc += d;
  if (Math.abs(wAcc) > 24) { step(Math.sign(wAcc)); wAcc = 0; needFresh = true; }
}, { passive: false });
let tY = null, tTop = false;
addEventListener('touchstart', e => { tY = e.touches[0].clientY; tTop = info.scrollTop <= 0; }, { passive: true });
addEventListener('touchmove', e => { if (state !== 4 && !menuOpen()) e.preventDefault(); }, { passive: false });
addEventListener('touchend', e => {
  if (tY == null || menuOpen()) return;
  const dy = tY - e.changedTouches[0].clientY; tY = null;
  if (state === 4) { if (tTop && dy < -60) step(-1); return; }
  if (Math.abs(dy) > 40) step(Math.sign(dy));
});
addEventListener('keydown', e => {
  if (menuOpen()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  const k = e.key;
  if (state === 4) {
    if ((k === 'ArrowUp' || k === 'PageUp') && info.scrollTop <= 0) { e.preventDefault(); step(-1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    return;
  }
  if (k === 'ArrowDown' || k === 'PageDown' || k === ' ') { e.preventDefault(); step(1); }
  else if (k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); step(-1); }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(3); }
});

/* sections of the info panel */
function openSection(id, instant) {
  const sec = $(id); if (!sec) return;
  const wasOpen = state === 4;
  if (!wasOpen) go(4, instant);
  const top = id === 'about' ? 0 : sec.offsetTop - (nav.offsetHeight - 40);
  info.scrollTo({ top, behavior: wasOpen && !RM.matches ? 'smooth' : 'auto' });
  lockUntil = performance.now() + 1000;
}
window.nueeHome = {
  nav(k) {
    if (k === 'home') { go(0); lockUntil = performance.now() + 1000; info.scrollTop = 0; if (location.hash) history.replaceState(null, '', location.pathname); }
    else if (['about', 'reviews', 'contact'].includes(k)) { openSection(k); history.replaceState(null, '', '#' + k); }
  }
};
const hashSection = () => { const h = location.hash.slice(1); return ['about', 'reviews', 'contact'].includes(h) ? h : null; };
addEventListener('hashchange', () => { const h = hashSection(); if (h) openSection(h); });

/* contact form (front-end only demo) */
const form = $('contactForm'), status = $('cf-status');
form.addEventListener('submit', e => {
  e.preventDefault();
  const ok = form.elements.name.value.trim() && form.elements.message.value.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.elements.email.value.trim());
  status.classList.toggle('err', !ok);
  status.dataset.i18n = ok ? 'contact.thanks' : 'contact.error';
  status.textContent = NUEE.t(status.dataset.i18n);
  if (ok) form.reset();
});

function relayout() { layout(); go(state, true); }
addEventListener('resize', relayout);
document.addEventListener('nuee:lang', () => requestAnimationFrame(relayout));

const api = { go: (n, instant) => go(n, instant), state: 0 };
window.nuee = api;

/* ---------- artwork ---------- */
document.querySelectorAll('.thumb i').forEach(i => {
  const [cx, cy, S] = i.dataset.crop.split(',').map(Number);
  i.style.backgroundImage = `url("${PHOTO}")`;
  i.style.backgroundSize = `${PHOTO_N / S * 100}% ${PHOTO_N / S * 100}%`;
  i.style.backgroundPosition = `${(cx - S / 2) / (PHOTO_N - S) * 100}% ${(cy - S / 2) / (PHOTO_N - S) * 100}%`;
});

/* ---------- hand cutout clean-up (erode 2px, feather once) ---------- */
function cleanCutout(url, crop) {
  return new Promise((res, rej) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const [cx, cy, cw, chh] = crop, cv = document.createElement('canvas');
        cv.width = cw; cv.height = chh;
        const g = cv.getContext('2d'); g.drawImage(img, cx, cy, cw, chh, 0, 0, cw, chh);
        const d = g.getImageData(0, 0, cw, chh), px = d.data, n = cw * chh;
        let a = new Uint8ClampedArray(n); for (let i = 0; i < n; i++) a[i] = px[i * 4 + 3];
        const at = (A, x, y) => (x < 0 || y < 0 || x >= cw || y >= chh) ? 0 : A[y * cw + x];
        for (let pass = 0; pass < 2; pass++) {
          const b = new Uint8ClampedArray(n);
          for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++)
            b[y * cw + x] = Math.min(at(a, x, y), at(a, x - 1, y), at(a, x + 1, y), at(a, x, y - 1), at(a, x, y + 1));
          a = b;
        }
        const f = new Uint8ClampedArray(n);
        for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
          let sum = 4 * a[y * cw + x], cnt = 4;
          [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < cw && Y < chh) { sum += a[Y * cw + X]; cnt++; } });
          f[y * cw + x] = sum / cnt;
        }
        for (let i = 0; i < n; i++) px[i * 4 + 3] = f[i];
        g.putImageData(d, 0, 0);
        cv.toBlob(bl => bl ? res(URL.createObjectURL(bl)) : rej(), 'image/webp', 0.92);
      } catch (e) { rej(e); }
    };
    img.onerror = rej; img.src = url;
  });
}
const handReady = cleanCutout(HAND_URL, HAND_CROP)
  .then(u => { handImg.src = handImg2.src = u; })
  .catch(() => { hand.classList.add('raw'); handFront.classList.add('raw'); handImg.src = handImg2.src = HAND_URL; });
const bottleReady = jar.decode ? jar.decode().catch(() => {}) : Promise.resolve();
const fontsReady = Promise.all([
  document.fonts.load('400 100px "Playfair Display"', 'nuée'),
  document.fonts.load('500 20px "Playfair Display"'),
  document.fonts.load('400 16px Outfit'), document.fonts.load('500 16px Outfit'),
  document.fonts.load('400 16px Jost', 'Ж'), document.fonts.load('400 16px "Playfair Display"', 'Ж')
]).catch(() => {}).then(() => document.fonts.ready);

/* ---------- boot ---------- */
info.inert = true;
layout(); snapAll();
requestAnimationFrame(render);
let started = false;
function begin() {
  if (started) return; started = true;
  layout(); snapAll();
  const h = hashSection();
  if (h) { openSection(h, true); }
  else if (!RM.matches) { ch.intro.snap(0.276 * vh); ch.intro.to(0, { dur: 1600, ease: EI }); }
  root.classList.remove('intro');
  startVideo();
}
Promise.all([fontsReady, handReady, bottleReady]).then(begin);
setTimeout(begin, 3500);
})();
</script>
